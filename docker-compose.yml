services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/rag
      LLM_PROVIDER: auto                          # anthropic, если задан ключ, иначе режим без LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: rag }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rag"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
